name: Heilbronn appointment monitor

on:
  schedule:
    # Five-minute cadence offset from the busy top of each hour.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a labeled sample alert instead of checking appointments
        required: false
        default: false
        type: boolean
      live_alert:
        description: Send one currently available real slot, even if already alerted
        required: false
        default: false
        type: boolean

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: termin
    timeout-minutes: 5
    env:
      HBN_LOOKAHEAD: "180"
      HBN_REALERT_HOURS: "3"
      HBN_TG_TOKEN: ${{ secrets.HBN_TG_TOKEN }}
      HBN_TG_CHAT: ${{ secrets.HBN_TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-
      - name: Send Telegram formatting test
        if: ${{ inputs.test_alert }}
        run: python3 heilbronn_monitor.py --test-alert
      - name: Send one currently available real slot
        if: ${{ inputs.live_alert && !inputs.test_alert }}
        run: python3 heilbronn_monitor.py --send-earliest-current-slot
      - name: Check for slots
        if: ${{ !inputs.test_alert && !inputs.live_alert }}
        run: python3 heilbronn_monitor.py --once
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
